name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # DB-backed tests require a Postgres with pgvector; skip in CI for now.
      - run: pnpm vitest run test/parseMarkdown.test.ts test/bridge.test.ts test/ai-disabled.test.ts
